name: Bina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Semak, uji dan bina
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon lint testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Sediakan APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/LangitLauncher-v1.0.${{ github.run_number }}.apk"

      - name: Muat naik artifak
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LangitLauncher-apk
          path: out/*.apk

      - name: Terbitkan ke Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Langit Launcher v1.0.${{ github.run_number }}
          files: out/*.apk

      - name: Simpan APK ke cawangan apk-out
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp out/*.apk /tmp/
          git checkout --orphan apk-out
          git rm -rf . > /dev/null
          rm -rf app gradle .github .gradle build out build.log || true
          cp /tmp/LangitLauncher-*.apk .
          git add LangitLauncher-*.apk
          git commit -m "APK v1.0.${{ github.run_number }}"
          git push -f origin apk-out

      - name: Simpan log ralat ke cawangan ci-logs
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || true
          cp app/build/reports/lint.txt /tmp/logs/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/logs/ 2>/dev/null || true
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null
          rm -rf app gradle .github .gradle build || true
          cp -r /tmp/logs/* .
          git add -A
          git commit -m "Log ralat run ${{ github.run_number }}"
          git push -f origin ci-logs
